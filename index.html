<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Gemz Forever</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#0f0a24}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;display:flex;flex-direction:row;gap:12px;padding:12px;
    background:radial-gradient(ellipse at 20% 0%,#3b1f6e 0%,#2a1450 35%,#0f0a24 100%);color:#f3eaff;
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  aside{flex:none;width:176px;display:flex;flex-direction:column;gap:14px;padding:6px 4px;position:relative}
  h1{margin:0 0 4px;font-size:30px;line-height:1.05;letter-spacing:.06em;
    background:linear-gradient(90deg,#ffd27a,#ff8fd1,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat{display:flex;flex-direction:column}
  .stat small{opacity:.65;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
  .stat b{font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
  .bar{height:10px;border-radius:6px;background:#ffffff18;overflow:hidden;box-shadow:inset 0 1px 3px #0008;margin-top:-6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7ad9,#ffd36e,#7affc6);transition:width .4s ease}
  .spacer{flex:1}
  .keys{font-size:11px;opacity:.45;line-height:1.5}
  #ver{font-size:10px;opacity:.3}
  #wrap{flex:1;min-width:0;min-height:0;position:relative}
  #board{position:absolute;inset:0;border-radius:14px;overflow:hidden;touch-action:none;
    background-color:#1b1036;
    background-image:conic-gradient(#ffffff0d 25%,transparent 0 50%,#ffffff0d 0 75%,transparent 0);
    background-size:calc(var(--cw) * 2) calc(var(--ch) * 2);box-shadow:0 10px 30px #000a,0 0 0 2px #ffffff22}
  #board.shake{animation:shake .3s}
  @keyframes shake{20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-4px -2px}80%{translate:3px 4px}}
  .gem{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);transition-property:transform;transition-duration:.25s;
    transition-timing-function:cubic-bezier(.45,0,.9,.6);will-change:transform;cursor:pointer}
  .gem svg{width:100%;height:100%;padding:8%;display:block;transition:transform .2s ease,opacity .22s ease;filter:drop-shadow(0 3px 3px #0007)}
  .gem:hover svg{transform:scale(1.06)}
  .gem.sel::before{content:"";position:absolute;inset:4%;border-radius:10px;border:2px solid #fff;box-shadow:0 0 12px #fff8}
  .gem.sel svg{transform:scale(1.1)}
  .gem.pop svg{transform:scale(0) rotate(40deg);opacity:0}
  .gem.born svg{animation:born .35s ease}
  @keyframes born{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .gem.hint svg{animation:hint .5s ease-in-out 4 alternate}
  @keyframes hint{to{transform:scale(1.18) rotate(-8deg)}}
  .gem.flame svg{animation:flame .9s ease-in-out infinite alternate}
  @keyframes flame{from{filter:drop-shadow(0 0 4px #ff9a2e) drop-shadow(0 0 2px #ffd36e)}to{filter:drop-shadow(0 0 12px #ff5a1e) drop-shadow(0 0 5px #ffe08a)}}
  .gem.star svg{animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .gem.star.pop svg{animation:none}
  .blast{position:absolute;width:calc(var(--cw) * 3);height:calc(var(--ch) * 3);border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,#fff 0%,#ffd36e 35%,#ff6a2e 65%,transparent 100%);animation:blast .4s ease-out forwards}
  @keyframes blast{from{transform:scale(.2);opacity:1}to{transform:scale(1.2);opacity:0}}
  .float{position:absolute;pointer-events:none;font-weight:800;font-size:34px;color:#fff;
    text-shadow:0 2px 0 #0008,0 0 10px #ff8fd1;transform:translate(-50%,-50%);animation:float .9s ease-out forwards;white-space:nowrap}
  @keyframes float{to{transform:translate(-50%,-160%);opacity:0}}
  .banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;
    font-size:72px;font-weight:900;color:#fff;text-shadow:0 5px 0 #0009,0 0 30px #ffb3ec;animation:banner 1.4s ease forwards}
  @keyframes banner{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
  button{font:inherit;font-size:14px;font-weight:600;color:#fff;border:0;border-radius:999px;padding:10px 14px;cursor:pointer;text-align:left;
    background:linear-gradient(180deg,#6d3fd0,#4a2496);box-shadow:0 3px 0 #2a1260,0 6px 14px #0006}
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1260}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g0" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffb0b0"/><stop offset=".45" stop-color="#ff2b3d"/><stop offset="1" stop-color="#7a0010"/></radialGradient>
    <radialGradient id="g1" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe0b0"/><stop offset=".45" stop-color="#ff8a1c"/><stop offset="1" stop-color="#8a3600"/></radialGradient>
    <radialGradient id="g2" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fffbd0"/><stop offset=".45" stop-color="#ffd816"/><stop offset="1" stop-color="#8a6a00"/></radialGradient>
    <radialGradient id="g3" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#c8ffd0"/><stop offset=".45" stop-color="#1fd45a"/><stop offset="1" stop-color="#00561f"/></radialGradient>
    <radialGradient id="g4" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#cfe9ff"/><stop offset=".45" stop-color="#2b8dff"/><stop offset="1" stop-color="#002f7a"/></radialGradient>
    <radialGradient id="g5" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#f3d0ff"/><stop offset=".45" stop-color="#b03bff"/><stop offset="1" stop-color="#46007a"/></radialGradient>
    <radialGradient id="g6" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#d9dde8"/><stop offset="1" stop-color="#6c7389"/></radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b5c"/><stop offset=".2" stop-color="#ffb21c"/><stop offset=".4" stop-color="#fff04a"/>
      <stop offset=".6" stop-color="#3dff8a"/><stop offset=".8" stop-color="#3ba8ff"/><stop offset="1" stop-color="#c03bff"/></linearGradient>
  </defs>
</svg>

<aside>
  <h1>GEMZ<br>FOREVER</h1>
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat"><small>Level</small><b id="level">1</b></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="stat"><small>Best</small><b id="best">0</b></div>
  <div class="spacer"></div>
  <button id="hintBtn">💡 Hint</button>
  <button id="newBtn">↻ New Game</button>
  <button id="muteBtn">🔊 Sound</button>
  <button id="fsBtn">⛶ Full Screen</button>
  <div class="keys">Keys: H hint · N new game<br>M sound · F full screen</div>
  <div id="ver">mac v2</div>
</aside>
<div id="wrap"><div id="board"></div></div>

<script>
(() => {
let ROWS = 10, COLS = 14; const TYPES = 7;
const SHAPES = [
  '<rect x="12" y="12" width="76" height="76" rx="16" ry="16" SHAPE/>',
  '<polygon points="50,6 89,28 89,72 50,94 11,72 11,28" SHAPE/>',
  '<polygon points="50,5 93,50 50,95 7,50" SHAPE/>',
  '<polygon points="32,6 68,6 90,30 90,70 68,94 32,94 10,70 10,30" SHAPE/>',
  '<circle cx="50" cy="50" r="42" SHAPE/>',
  '<polygon points="50,8 95,88 5,88" SHAPE/>',
  '<polygon points="50,3 63,37 97,50 63,63 50,97 37,63 3,50 37,37" SHAPE/>'
];
function gemSVG(t, s) {
  if (s === 2) {
    return `<svg viewBox="0 0 100 100"><polygon points="50,2 61,36 97,36 68,58 79,94 50,72 21,94 32,58 3,36 39,36"
      fill="url(#rainbow)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="50" cy="52" r="10" fill="#fff" opacity=".85"/></svg>`;
  }
  const sh = SHAPES[t];
  const base = sh.replace('SHAPE', `fill="url(#g${t})" stroke="#0005" stroke-width="2.5" stroke-linejoin="round"`);
  const facet = sh.replace('SHAPE', `fill="#fff" opacity=".2" transform="translate(50 50) scale(.55) translate(-50 -50)"`);
  return `<svg viewBox="0 0 100 100">${base}${facet}<ellipse cx="36" cy="30" rx="14" ry="8" fill="#fff" opacity=".55" transform="rotate(-30 36 30)"/></svg>`;
}

const boardEl = document.getElementById('board'), wrapEl = document.getElementById('wrap');
let grid = [], busy = false, score = 0, level = 1, levelStart = 0, combo = 0, sel = null, best = 0, muted = false;
try { best = +localStorage.getItem('mucevher-best') || 0; muted = localStorage.getItem('mucevher-mute') === '1'; } catch (e) {}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = n => Math.floor(Math.random() * n);
const target = () => 500 + level * 350;
const key = (r, c) => r * COLS + c;
const rc = k => [Math.floor(k / COLS), k % COLS];
const inB = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;

// ---------- Layout: grid size follows the window, board fills it edge to edge ----------
const CELL = 148; // target gem size in px
function dimsFor(w, h) {
  const rows = Math.max(4, Math.min(14, Math.round(h / CELL)));
  const cols = Math.max(4, Math.min(26, Math.round(w / (h / rows))));
  return [rows, cols];
}
let pendingResize = false;
function layout(force) {
  const w = wrapEl.clientWidth, h = wrapEl.clientHeight;
  if (!w || !h) return;
  const [r, c] = dimsFor(w, h);
  if (!force && r === ROWS && c === COLS) return;
  if (busy && !force) { pendingResize = true; return; }
  ROWS = r; COLS = c;
  const st = document.documentElement.style;
  st.setProperty('--cw', (100 / COLS) + '%'); st.setProperty('--ch', (100 / ROWS) + '%');
  sel = null; try { clearHint(); } catch (e) {}
  fillBoard();
}
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => layout(), 180); });

// ---------- Sound ----------
// Soft bell / glass tones: sine partials, gentle attack, low-pass, light echo.
let ac = null, bus = null;
function audio() {
  if (muted) return null;
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const master = ac.createGain(); master.gain.value = .55;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200;
      const comp = ac.createDynamicsCompressor();
      const delay = ac.createDelay(); delay.delayTime.value = .16;
      const fb = ac.createGain(); fb.gain.value = .28;
      const wet = ac.createGain(); wet.gain.value = .22;
      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
      master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
      lp.connect(delay); delay.connect(dlp); dlp.connect(fb); fb.connect(delay); dlp.connect(wet); wet.connect(comp);
      bus = master;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  } catch (e) { return null; }
}
const BELL = [[1, 1], [2, .28], [3, .1], [4.2, .05]];
const SOFT = [[1, 1], [2, .12]];
function tone(freq, { at = 0, dur = .5, vol = .12, attack = .008, partials = BELL, glide = 1 } = {}) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + at;
  for (const [mul, amp] of partials) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * mul, t);
    if (glide !== 1) o.frequency.exponentialRampToValueAtTime(freq * mul * glide, t + dur * .6);
    const d = dur / Math.sqrt(mul);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * amp, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .05);
  }
}
function whoosh(at = 0, dur = .35, vol = .1, from = 1800, to = 300) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + at, len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .25); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(bus); src.start(t); src.stop(t + dur);
}
const PENTA = [0, 2, 4, 7, 9];
const note = i => 523.25 * Math.pow(2, (PENTA[i % 5] + 12 * Math.floor(i / 5)) / 12);
const sfx = {
  select() { tone(1318.5, { dur: .18, vol: .05, partials: SOFT }); },
  swap()   { whoosh(0, .18, .045, 900, 2400); },
  bad()    { /* no notes when the gems swap back: only the swap swish is heard */ },
  match(c) {
    const i = Math.min(c - 1, 9);
    tone(note(i), { dur: .7, vol: .11 });
    tone(note(i + 2), { at: .045, dur: .6, vol: .06 });
  },
  special(s) {
    if (s === 2) [0, 2, 4, 5, 7].forEach((n, k) => tone(note(n + 3), { at: k * .05, dur: .8, vol: .07 }));
    else { tone(note(5), { dur: .9, vol: .09 }); tone(note(7), { at: .06, dur: .9, vol: .06 }); }
  },
  boom()   { whoosh(0, .55, .16, 1400, 120); tone(130.8, { dur: .6, vol: .14, partials: SOFT, glide: .6 }); },
  rainbow(){ [0, 1, 2, 3, 4, 5, 6, 7, 8].forEach((n, k) => tone(note(n + 2), { at: k * .045, dur: .7, vol: .06 })); whoosh(0, .7, .07, 600, 4000); },
  level()  { [0, 2, 4, 5, 7, 10].forEach((n, k) => tone(note(n), { at: k * .09, dur: 1.1, vol: .09 })); }
};
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

// ---------- Gems ----------
function newGem(t, s = 0) {
  const el = document.createElement('div');
  el.className = 'gem' + (s === 1 ? ' flame' : s === 2 ? ' star' : '');
  el.innerHTML = gemSVG(t, s);
  boardEl.appendChild(el);
  return { t: s === 2 ? -1 : t, s, el };
}
function setPos(g, r, c, dur) {
  if (dur === 0) g.el.style.transition = 'none';
  else { g.el.style.transition = ''; if (dur) g.el.style.transitionDuration = dur + 's'; }
  g.el.style.transform = `translate(${c * 100}%,${r * 100}%)`;
}
const at = (r, c) => inB(r, c) ? grid[r][c] : null;

function fillBoard() {
  boardEl.querySelectorAll('.gem').forEach(e => e.remove());
  do {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid.push([]);
      for (let c = 0; c < COLS; c++) {
        let t;
        do { t = rand(TYPES); } while (
          (c >= 2 && grid[r][c-1].t === t && grid[r][c-2].t === t) ||
          (r >= 2 && grid[r-1][c].t === t && grid[r-2][c].t === t));
        grid[r].push({ t, s: 0 });
      }
    }
  } while (!findMove());
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const g = newGem(grid[r][c].t); grid[r][c] = g; setPos(g, r - ROWS, c, 0);
  }
  void boardEl.offsetWidth;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) setPos(grid[r][c], r, c, .35 + (ROWS - r) * .04);
}

// ---------- Matching ----------
function findMatches() {
  const runs = [], cells = new Set();
  const typeAt = (r, c) => { const g = grid[r][c]; return g && g.s !== 2 ? g.t : -1; };
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = typeAt(r, c); let e = c + 1;
      if (t >= 0) while (e < COLS && typeAt(r, e) === t) e++;
      if (t >= 0 && e - c >= 3) { const cs = []; for (let x = c; x < e; x++) { cs.push([r, x]); cells.add(key(r, x)); } runs.push({ t, cells: cs }); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = typeAt(r, c); let e = r + 1;
      if (t >= 0) while (e < ROWS && typeAt(e, c) === t) e++;
      if (t >= 0 && e - r >= 3) { const cs = []; for (let y = r; y < e; y++) { cs.push([y, c]); cells.add(key(y, c)); } runs.push({ t, cells: cs }); }
      r = e;
    }
  }
  return { runs, cells };
}
function findMove() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (grid[r][c].s === 2) return [[r, c], c + 1 < COLS ? [r, c + 1] : [r, c - 1]];
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (!inB(r2, c2)) continue;
      [grid[r][c], grid[r2][c2]] = [grid[r2][c2], grid[r][c]];
      const ok = findMatches().cells.size > 0;
      [grid[r][c], grid[r2][c2]] = [grid[r2][c2], grid[r][c]];
      if (ok) return [[r, c], [r2, c2]];
    }
  }
  return null;
}
function planSpecials(m, moved) {
  const spawns = new Map(), count = new Map();
  for (const run of m.runs) for (const [r, c] of run.cells) { const k = key(r, c); count.set(k, (count.get(k) || 0) + 1); }
  for (const run of m.runs) {
    if (run.cells.length < 4) continue;
    let pos = run.cells[Math.floor(run.cells.length / 2)];
    if (moved) for (const p of moved) if (run.cells.some(q => q[0] === p[0] && q[1] === p[1])) pos = p;
    const k = key(pos[0], pos[1]), s = run.cells.length >= 5 ? 2 : 1;
    if (!spawns.has(k) || spawns.get(k).s < s) spawns.set(k, { t: run.t, s });
  }
  for (const [k, n] of count) if (n > 1 && !spawns.has(k)) { const [r, c] = rc(k); spawns.set(k, { t: grid[r][c].t, s: 1 }); }
  return spawns;
}

// ---------- Clearing ----------
function floatText(txt, r, c) {
  const d = document.createElement('div'); d.className = 'float'; d.textContent = txt;
  d.style.left = ((c + .5) / COLS * 100) + '%'; d.style.top = ((r + .5) / ROWS * 100) + '%';
  boardEl.appendChild(d); setTimeout(() => d.remove(), 950);
}
function banner(txt) {
  const d = document.createElement('div'); d.className = 'banner'; d.textContent = txt;
  boardEl.appendChild(d); setTimeout(() => d.remove(), 1450);
}
function mostCommonType() {
  const cnt = Array(TYPES).fill(0);
  for (const row of grid) for (const g of row) if (g && g.s !== 2) cnt[g.t]++;
  return cnt.indexOf(Math.max(...cnt));
}
async function clearCells(set, spawns) {
  const toClear = new Set(set), queue = [...set], blasts = [];
  while (queue.length) {
    const k = queue.pop(), [r, c] = rc(k), g = grid[r][c];
    if (!g || g.fired) continue;
    if (g.s === 1) {
      g.fired = true; blasts.push([r, c]);
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (!inB(rr, cc)) continue;
        const kk = key(rr, cc);
        if (!toClear.has(kk)) { toClear.add(kk); queue.push(kk); }
      }
    } else if (g.s === 2) {
      g.fired = true; const col = mostCommonType();
      for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) {
        const h = grid[rr][cc], kk = key(rr, cc);
        if (h && h.t === col && !toClear.has(kk)) { toClear.add(kk); queue.push(kk); }
      }
    }
  }
  let sr = 0, sc = 0;
  for (const k of toClear) {
    const [r, c] = rc(k); sr += r; sc += c;
    const g = grid[r][c]; if (g) g.el.classList.add('pop');
  }
  for (const [r, c] of blasts) {
    const b = document.createElement('div'); b.className = 'blast';
    b.style.left = ((c - 1) / COLS * 100) + '%'; b.style.top = ((r - 1) / ROWS * 100) + '%';
    boardEl.appendChild(b); setTimeout(() => b.remove(), 420);
  }
  if (blasts.length) { boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); sfx.boom(); buzz(40); }
  const pts = toClear.size * 10 * combo + blasts.length * 50 + (toClear.size >= 10 ? 100 : 0);
  score += pts;
  floatText('+' + pts + (combo > 1 ? `  x${combo}` : ''), sr / toClear.size, sc / toClear.size);
  if (!blasts.length) sfx.match(combo);
  updateHUD();
  await sleep(blasts.length ? 300 : 220);
  for (const k of toClear) {
    const [r, c] = rc(k);
    if (grid[r][c]) { grid[r][c].el.remove(); grid[r][c] = null; }
  }
  for (const [k, sp] of spawns) {
    const [r, c] = rc(k);
    const g = newGem(sp.t, sp.s); g.el.classList.add('born'); setPos(g, r, c, 0); grid[r][c] = g;
    sfx.special(sp.s);
  }
}
async function gravity() {
  const moves = []; let maxDur = 0;
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (g) { if (w !== r) { grid[w][c] = g; grid[r][c] = null; moves.push([g, w, c, w - r]); } w--; }
    }
    const gap = w + 1;
    for (let r = w; r >= 0; r--) {
      const g = newGem(rand(TYPES)); grid[r][c] = g; setPos(g, r - gap, c, 0); moves.push([g, r, c, gap]);
    }
  }
  void boardEl.offsetWidth;
  for (const [g, r, c, d] of moves) { const dur = .12 + .05 * d; maxDur = Math.max(maxDur, dur); setPos(g, r, c, dur); }
  await sleep(maxDur * 1000 + 40);
}
async function resolve(moved, startCombo = 0) {
  combo = startCombo;
  while (true) {
    const m = findMatches();
    if (!m.cells.size) break;
    combo++;
    if (combo === 3) banner('Great!'); else if (combo === 5) banner('Awesome!'); else if (combo === 7) banner('Incredible!');
    await clearCells(m.cells, planSpecials(m, moved));
    await gravity();
    moved = null;
  }
  await checkLevel();
  if (!findMove()) { banner('Shuffling…'); await sleep(700); await shuffle(); }
}
async function shuffle() {
  for (const row of grid) for (const g of row) g.el.classList.add('pop');
  await sleep(250);
  fillBoard();
  await sleep(700);
}
async function checkLevel() {
  if (score - levelStart >= target()) {
    levelStart += target(); level++;
    banner('Level ' + level + '!');
    sfx.level();
    buzz([30, 40, 30]);
    updateHUD(); await sleep(900);
  }
}
function updateHUD() {
  document.getElementById('score').textContent = score.toLocaleString('en-US');
  document.getElementById('level').textContent = level;
  if (score > best) { best = score; try { localStorage.setItem('mucevher-best', best); } catch (e) {} }
  document.getElementById('best').textContent = best.toLocaleString('en-US');
  document.getElementById('prog').style.width = Math.min(100, (score - levelStart) / target() * 100) + '%';
}

// ---------- Swapping ----------
function swapGrid(a, b) { [grid[a[0]][a[1]], grid[b[0]][b[1]]] = [grid[b[0]][b[1]], grid[a[0]][a[1]]]; }
async function animSwap(a, b) {
  swapGrid(a, b);
  setPos(grid[a[0]][a[1]], a[0], a[1], .18); setPos(grid[b[0]][b[1]], b[0], b[1], .18);
  await sleep(200);
}
async function trySwap(a, b) {
  if (busy) return;
  busy = true; clearSel(); clearHint();
  sfx.swap();
  await animSwap(a, b);
  const ga = grid[a[0]][a[1]], gb = grid[b[0]][b[1]];
  if (ga.s === 2 || gb.s === 2) {
    const set = new Set();
    if (ga.s === 2 && gb.s === 2) {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) set.add(key(r, c));
    } else {
      const [sp, other] = ga.s === 2 ? [a, b] : [b, a];
      const og = grid[other[0]][other[1]];
      set.add(key(sp[0], sp[1]));
      grid[sp[0]][sp[1]].fired = true;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (grid[r][c].t === og.t) set.add(key(r, c));
    }
    banner('Rainbow!'); buzz(60); sfx.rainbow();
    combo = 1;
    await clearCells(set, new Map());
    await gravity();
    await resolve(null, 1);
  } else if (findMatches().cells.size) {
    await resolve([a, b]);
  } else {
    sfx.bad();
    await animSwap(a, b);
  }
  busy = false;
  if (pendingResize) { pendingResize = false; layout(); }
  resetIdle();
}

// ---------- Input ----------
function clearSel() { if (sel) { const g = at(sel[0], sel[1]); if (g) g.el.classList.remove('sel'); sel = null; } }
function cellFrom(e) {
  const rect = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * COLS), r = Math.floor((e.clientY - rect.top) / rect.height * ROWS);
  return inB(r, c) ? [r, c] : null;
}
let start = null, startXY = null, dragged = false;
let unlocked = false;
function unlockAudio() {
  if (unlocked) return; unlocked = true;
  audio();
}
document.addEventListener('touchend', unlockAudio); document.addEventListener('mousedown', unlockAudio);
boardEl.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  if (busy) return;
  start = cellFrom(e); startXY = [e.clientX, e.clientY]; dragged = false;
  try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
});
boardEl.addEventListener('pointermove', e => {
  if (!start || dragged || busy) return;
  const dx = e.clientX - startXY[0], dy = e.clientY - startXY[1];
  const th = boardEl.getBoundingClientRect().width / COLS * .3;
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  dragged = true;
  const [r, c] = start;
  const b = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
  if (inB(b[0], b[1])) trySwap(start, b);
  start = null;
});
boardEl.addEventListener('pointerup', () => {
  if (!start || dragged || busy) { start = null; return; }
  const p = start; start = null;
  if (sel) {
    const adj = Math.abs(sel[0] - p[0]) + Math.abs(sel[1] - p[1]) === 1;
    if (adj) { const a = sel; trySwap(a, p); return; }
    const same = sel[0] === p[0] && sel[1] === p[1];
    clearSel(); if (same) return;
  }
  sel = p; grid[p[0]][p[1]].el.classList.add('sel'); sfx.select();
});
boardEl.addEventListener('pointercancel', () => { start = null; });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- Hint / idle ----------
let idleTimer = null, hinted = [];
function clearHint() { hinted.forEach(g => g.el.classList.remove('hint')); hinted = []; }
function showHint() {
  if (busy) return;
  clearHint();
  const mv = findMove(); if (!mv) return;
  hinted = mv.map(([r, c]) => grid[r][c]);
  hinted.forEach(g => { g.el.classList.remove('hint'); void g.el.offsetWidth; g.el.classList.add('hint'); });
}
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(showHint, 12000); }

document.getElementById('hintBtn').onclick = () => { showHint(); resetIdle(); };
document.getElementById('newBtn').onclick = () => {
  if (busy) return;
  score = 0; level = 1; levelStart = 0; sel = null; updateHUD(); fillBoard(); resetIdle();
};
const muteBtn = document.getElementById('muteBtn');
function renderMute() { muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound'; }
muteBtn.onclick = () => { muted = !muted; try { localStorage.setItem('mucevher-mute', muted ? '1' : '0'); } catch (e) {} renderMute(); if (!muted) { unlocked = false; unlockAudio(); sfx.select(); } };

// ---------- Offline (PWA) ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  try {
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  } catch (e) {}
}

const fsBtn = document.getElementById('fsBtn');
function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
function toggleFs() {
  try {
    if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  } catch (e) {}
}
fsBtn.onclick = toggleFs;
function renderFs() { fsBtn.textContent = isFs() ? '⛶ Exit Full Screen' : '⛶ Full Screen'; }
document.addEventListener('fullscreenchange', renderFs); document.addEventListener('webkitfullscreenchange', renderFs);
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') document.getElementById('hintBtn').click();
  else if (k === 'n') document.getElementById('newBtn').click();
  else if (k === 'm') muteBtn.click();
  else if (k === 'f') toggleFs();
});

renderMute(); updateHUD(); layout(true); resetIdle();
})();
</script>
</body>
